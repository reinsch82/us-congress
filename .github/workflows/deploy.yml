name: Update data and deploy

on:
  schedule:
    - cron: '17 6 * * *'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment-retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # If the new data fails the sanity checks, keep deploying the last good snapshot
      # and mark the run as failed at the end.
      - name: Build data snapshot
        id: data
        continue-on-error: true
        run: node scripts/build-data.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build governors snapshot
        id: governors
        continue-on-error: true
        run: node scripts/build-governors.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Committing only when the data changed keeps a history of upstream updates.
      # GitHub turns off scheduled workflows after 60 days without repository activity,
      # and upstream has gone longer than that without touching the legislator files,
      # so after 45 quiet days an empty commit keeps the schedule alive.
      - name: Commit snapshot if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898341+github-actions[bot]@users.noreply.github.com"
          # A re-run or an overlapping run may find main already moved on: rebase onto it,
          # keeping this run's freshly built data on conflicts.
          push() { git pull --rebase -X theirs origin main && git push; }
          if [ -n "$(git status --porcelain -- data)" ]; then
            git add data
            git commit -m "Update data snapshots"
            push
          elif [ $(( $(date +%s) - $(git log -1 --format=%ct) )) -gt $(( 45 * 86400 )) ]; then
            git commit --allow-empty -m "Keep scheduled data update active"
            push
          fi

      - name: Assemble site
        run: |
          mkdir _site
          cp -r *.html .nojekyll css js data _site/
          scripts/stamp-build.sh _site "${GITHUB_SHA::8}"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true

      # Right after the upload, GitHub sometimes reports the artifact as missing. Try again.
      - name: Wait before retrying the deployment
        if: steps.deployment.outcome == 'failure'
        run: sleep 30

      - id: deployment-retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4

      - name: Report data build failure
        if: steps.data.outcome == 'failure' || steps.governors.outcome == 'failure'
        run: |
          [ "${{ steps.data.outcome }}" = failure ] && echo "::error::The legislator snapshot was not updated; the previous one was deployed."
          [ "${{ steps.governors.outcome }}" = failure ] && echo "::error::The governor snapshot was not updated; the previous one was deployed."
          exit 1
